name: CI
on:
  push:
    branches: ["main"]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: read
  packages: write
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Validate docker compose config
        run: docker compose config
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Build frontend image
        run: docker build ./frontend
      - name: Build and push versioned frontend
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker build -t ghcr.io/${{ env.OWNER_LC }}/frontend:latest ./frontend
          docker push ghcr.io/${{ env.OWNER_LC }}/frontend:latest
          docker build -t ghcr.io/${{ env.OWNER_LC }}/frontend:${{ github.ref_name }} ./frontend
          docker push ghcr.io/${{ env.OWNER_LC }}/frontend:${{ github.ref_name }}
      - name: Build backend image
        run: docker build ./backend
      - name: Build and push versioned backend
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker build -t ghcr.io/${{ env.OWNER_LC }}/backend:latest ./backend
          docker push ghcr.io/${{ env.OWNER_LC }}/backend:latest
          docker build -t ghcr.io/${{ env.OWNER_LC }}/backend:${{ github.ref_name }} ./backend
          docker push ghcr.io/${{ env.OWNER_LC }}/backend:${{ github.ref_name }}
