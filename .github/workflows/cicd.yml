name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
  packages: write
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate docker compose config
        run: docker compose config
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Build frontend image
        run: docker build -t ghcr.io/${{ env.OWNER_LC }}/frontend:latest ./frontend
      - name: Push frontend image
        run: docker push ghcr.io/${{ env.OWNER_LC }}/frontend:latest
      - name: Build backend image
        run: docker build -t ghcr.io/${{ env.OWNER_LC }}/backend:latest ./backend
      - name: Push backend image
        run: docker push ghcr.io/${{ env.OWNER_LC }}/backend:latest
